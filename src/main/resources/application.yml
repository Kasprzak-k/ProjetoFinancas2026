spring:
  application:
    name: portfolio-aggregator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
    username: ${DB_USER:portfolio_user}
    password: ${DB_PASSWORD:portfolio_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080

# Integração com a API pública (keyless) do CoinGecko — Pendência 1.A
coingecko:
  api:
    base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
    connect-timeout-ms: ${COINGECKO_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${COINGECKO_READ_TIMEOUT_MS:5000}
